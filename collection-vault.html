.grid{display:grid;gap:10px;max-width:480px}.grid label{display:grid;gap:3px}

else if(pg=='add')h=`<h2>Add to the collection</h2><div class="cards">${db.cols.map(c=>`<div class="card" data-go="#/add/${c.id}">${esc(c.name)}</div>`).join('')}<div class="card" data-act="newc">+ Create a new collection</div></div>`;
else if(pg=='edit'&&C){AV={v:C.view,F:FIELDS,persist:true};h=back('Edit the collection','#/edit')+`<h2>${esc(C.name)}: default view</h2><p class="mu">These settings apply whenever the collection opens. Changes save automatically.</p>`+bar()+table(C.rows,C.view,FIELDS)}
else if(pg=='edit')h=`<h2>Edit the collection</h2><h3>Collections</h3>`+db.cols.map(c=>`<div class="row" style="margin:6px 0"><b style="min-width:190px">${esc(c.name)}</b><span class="mu" style="min-width:70px">${c.rows.length} items</span><button data-go="#/edit/${c.id}">Group, sort and filter</button><button data-ren="${c.id}">Rename</button><button data-delc="${c.id}">Delete</button></div>`).join('')+optsHtml()+backupHtml();
else h=`<h2 style="text-align:center">Welcome back</h2><div class="cards"><div class="card" data-go="#/view">View the collection<small>Browse, group, sort, filter</small></div><div class="card" data-go="#/add">Add to the collection<small>Quick entry form</small></div><div class="card" data-go="#/edit">Edit the collection<small>Settings, options, backup</small></div></div>`;
$('#app').innerHTML=h;scrollTo(0,y)}
/* events */
const rec=id=>{for(const c of db.cols){const r=c.rows.find(r=>r.id==id);if(r)return r}};
function edit(td){const r=rec(td.parentNode.dataset.id),k=td.dataset.k,f=FIELDS.find(x=>x.k==k);let el,fin=false;
if(f.t=='sel'){el=document.createElement('select');el.innerHTML='<option value=""></option>'+db.opts[k].map(o=>`<option>${esc(o)}</option>`).join('')+'<option value="\u0000">+ New option…</option>';el.value=r[k]}
else{el=document.createElement('input');el.value=r[k];if(f.t=='num'){el.type='number';el.min=0;el.step=1}}
td.textContent='';td.append(el);el.focus();
const done=()=>{if(fin)return;fin=true;let v=el.value;if(v==='\u0000'){v=(prompt('New '+f.name+' option:')||'').trim();if(!v)return render()}
if(f.t=='num')v=Math.max(0,Math.floor(+v)||0);else v=v.trim();if(v===r[k])return render();
commit(()=>{if(f.t=='sel'&&v&&!db.opts[k].includes(v))db.opts[k].push(v);r[k]=v})};
el.onblur=done;el.onkeydown=e=>{if(e.key=='Enter')el.blur();if(e.key=='Escape'){fin=true;render()}};if(f.t=='sel')el.onchange=done}
document.addEventListener('click',e=>{const t=e.target,d=t.closest('[data-go],[data-pop],[data-add],[data-del],[data-act],[data-ren],[data-delc],[data-az],[data-addopt],[data-rm],[data-x]');
if(pop&&!d&&!t.closest('.pop')){pop=null;return render()}
if(!d){const td=t.closest('td[data-k]');if(td&&!td.firstElementChild)edit(td);return}
e.preventDefault();const a=d.dataset,C=db.cols.find(c=>c.id==location.hash.split('/')[2]);
if(a.go)location.hash=a.go;
else if(a.pop!==undefined){pop=pop==a.pop?null:a.pop;render()}
else if(a.add)chg(()=>AV.v[a.add].push(a.add=='filters'?{f:'n',o:'contains',v:''}:{f:'f',d:1}));
else if(a.del)chg(()=>AV.v[a.del].splice(+a.i,1));
else if(a.x)commit(()=>{for(const c of db.cols){const i=c.rows.findIndex(r=>r.id==a.x);if(i>=0)c.rows.splice(i,1)}});
else if(a.ren){const c=db.cols.find(c=>c.id==a.ren),n=(prompt('Collection name:',c.name)||'').trim();if(n)commit(()=>{c.name=n;fix()})}
else if(a.delc){const c=db.cols.find(c=>c.id==a.delc);if(confirm(`Delete "${c.name}" and its ${c.rows.length} items? (Ctrl+Z can undo this.)`))commit(()=>db.cols.splice(db.cols.indexOf(c),1))}
else if(a.az)commit(()=>db.opts[a.az].sort(az));
else if(a.addopt){const v=$('#n_'+a.addopt).value.trim();if(v&&!db.opts[a.addopt].includes(v))commit(()=>db.opts[a.addopt].push(v))}
else if(a.rm)commit(()=>db.opts[a.rm].splice(+a.i,1));
else if(a.act=='reset'){delete TV[location.hash.split('/')[2]];render()}
else if(a.act=='newc'){const n=(prompt('Name for the new collection:')||'').trim();if(n){const id='c'+uid();commit(()=>db.cols.push({id,name:n,view:dv(n),rows:[]}));location.hash='#/add/'+id}}
else if(a.act=='add'){const g=i=>$('#a_'+i).value.trim(),n=g('n');if(!n)return setSt('Enter a name first');let q=Math.floor(+$('#a_q').value);if(!(q>=0))q=0;
FV={n:'',f:g('f'),b:g('b'),t:g('t'),p:g('p'),q};commit(()=>{['f','b','t','p'].forEach(k=>{if(FV[k]&&!db.opts[k].includes(FV[k]))db.opts[k].push(FV[k])});C.rows.push({id:uid(),n,f:FV.f,b:FV.b,t:FV.t,p:FV.p,q,_c:C.name})});setSt('Added "'+n+'"');$('#a_n').focus()}
else if(a.act=='conn'){localStorage.cid=$('#cid').value.trim();backup()}
else if(a.act=='rest')restore();
else if(a.act=='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([ser(db)],{type:'application/json'}));l.download='collection-vault.json';l.click()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset;
if(a.hide){chg(()=>{const h=AV.v.hidden;t.checked?h.splice(h.indexOf(a.hide),1):h.push(a.hide)})}
else if(a.p){chg(()=>{const x=AV.v[a.l][+a.i];x[a.p]=a.p=='d'?+t.value:t.value;if(a.p=='f'&&x.o!==undefined){x.o=OPS[tp(x.f)][0];x.v=''}})}
else if(t.id=='imp'&&t.files[0])t.files[0].text().then(s=>commit(()=>{db=JSON.parse(s);fix()}))});
document.addEventListener('dblclick',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k,o=db.opts[k][+c.dataset.i],n=(prompt('Rename option:',o)||'').trim();if(n&&n!=o)commit(()=>{db.opts[k][+c.dataset.i]=n;db.cols.forEach(c=>c.rows.forEach(r=>{if(r[k]==o)r[k]=n}))})});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c)DR={k:c.dataset.k,i:+c.dataset.i}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.chip'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('.chip');if(!c||!DR)return;e.preventDefault();const k=DR.k,from=DR.i,to=+c.dataset.i;DR=null;if(c.dataset.k!=k||to==from)return;commit(()=>{const a=db.opts[k];a.splice(to,0,a.splice(from,1)[0])})});
window.onhashchange=()=>{pop=null;TV={};render()};
/* Google Drive (drive.file scope: the app only sees the file it creates) */
const FN='collection-vault.json',API='https://www.googleapis.com/';
function gConnect(cb){const id=localStorage.cid;if(!id)return setSt('Add your Client ID first');if(!window.google)return setSt('Google sign-in did not load. Check your connection.');
tc=google.accounts.oauth2.initTokenClient({client_id:id,scope:API+'auth/drive.file',callback:r=>{if(r.access_token){tok=r.access_token;setSt('Connected to Drive');cb&&cb()}else setSt('Google sign-in failed')}});tc.requestAccessToken({prompt:''})}
async function dr(u,o={}){const r=await fetch(u,{...o,headers:{...o.headers,Authorization:'Bearer '+tok}});if(!r.ok)throw new Error(r.status);return r}
async function findF(){return((await(await dr(API+'drive/v3/files?fields=files(id)&q='+encodeURIComponent(`name='${FN}' and trashed=false`))).json()).files[0]||{}).id}
async function backup(){if(!tok)return gConnect(backup);try{const id=await findF(),bd='b'+Date.now();
await dr(API+'upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:`--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(id?{}:{name:FN})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${ser(db)}\r\n--${bd}--`});setSt('Backed up '+new Date().toLocaleTimeString())}catch(e){tok=null;setSt('Backup failed ('+e.message+'). Click Connect again.')}}
async function restore(){if(!tok)return gConnect(restore);try{const id=await findF();if(!id)return setSt('No backup found in Drive');const s=await(await dr(API+'drive/v3/files/'+id+'?alt=media')).text();commit(()=>{db=JSON.parse(s);fix()});setSt('Restored from Drive')}catch(e){tok=null;setSt('Restore failed ('+e.message+')')}}
save();render();
</script></body></html>
