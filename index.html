<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collector’s Vault</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#eceff1;--p:#fff;--p2:#e1e7ea;--pr:#0f6b66;--ac:#f2b705;--tx:#17232d;--mu:#5d6f7c;--ln:#c5d0d6;--hl:#fff3c4;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101a21;--p:#17242d;--p2:#1f303b;--pr:#2aa39a;--tx:#e8eff2;--mu:#93a6b2;--ln:#2d4350;--hl:#3a3410;--on:#06201e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.45 system-ui,"Segoe UI",sans-serif}
h1,h2,h3,h4,.card{font-family:Rockwell,"Roboto Slab","Courier New",Georgia,serif}
header{display:flex;align-items:center;gap:12px;padding:6px 16px;background:var(--pr);color:var(--on);position:sticky;top:0;z-index:20;border-bottom:4px solid var(--ac)}
#logo{cursor:pointer;width:60px;height:60px;background:none;border:0;padding:0}
header h1{font-size:22px;margin:0}#sync{margin-left:auto;font-size:12px}main{padding:16px}.mu{color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:900px;margin:24px auto}
.card{background:var(--p);border:1px solid var(--ln);border-left:8px solid var(--ac);border-radius:8px;padding:26px 22px;cursor:pointer;font-size:20px;font-weight:700}
.card:hover{border-color:var(--pr);border-left-color:var(--ac)}.card small{display:block;font:400 13.5px system-ui,sans-serif;color:var(--mu);margin-top:6px}
button,select,input{font:inherit;color:var(--tx);background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--pr)}button.pri{background:var(--pr);border-color:var(--pr);color:var(--on)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
table{border-collapse:collapse;width:100%;background:var(--p)}th,td{border-bottom:1px solid var(--ln);padding:6px 9px;text-align:left}
th{position:sticky;top:72px;background:var(--p2);color:var(--mu);font-weight:600;border-bottom:2px solid var(--ln);z-index:5}
tbody tr:hover td{background:var(--hl)}td[data-k]{cursor:text}td input,td select{width:100%;padding:2px}
tbody tr.gh td{background:var(--p2);font-weight:700;border-left:4px solid var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;position:relative}
.pop{position:absolute;top:38px;left:0;background:var(--p);border:1px solid var(--pr);box-shadow:0 8px 24px rgba(0,0,0,.2);border-radius:10px;padding:12px;z-index:15;min-width:340px;display:grid;gap:7px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:3px 10px;margin:3px;cursor:grab}.chip:hover{border-color:var(--ac)}.chip b{cursor:pointer;color:var(--pr)}
.grid{display:grid;gap:10px;max-width:480px}.grid label{display:grid;gap:3px}
a{color:var(--pr)}h2,h3,h4{margin:14px 0 6px}
.hero,.stats,.tiles,.sec{max-width:900px;margin-left:auto;margin-right:auto}

FV={n:'',f:g('f'),b:g('b'),t:g('t'),p:g('p'),q};commit(()=>{['f','b','t','p'].forEach(k=>{if(FV[k]&&!db.opts[k].includes(FV[k]))db.opts[k].push(FV[k])});C.rows.push({id:uid(),n,f:FV.f,b:FV.b,t:FV.t,p:FV.p,q,ts:Date.now(),_c:C.name})});setSt('Added "'+n+'"');$('#a_n').focus()}
else if(a.act=='conn'){localStorage.cid=$('#cid').value.trim();backup()}
else if(a.act=='rest')restore();
else if(a.act=='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([ser(db)],{type:'application/json'}));l.download='collection-vault.json';l.click()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset;
if(a.hide){chg(()=>{const h=AV.v.hidden;t.checked?h.splice(h.indexOf(a.hide),1):h.push(a.hide)})}
else if(a.p){chg(()=>{const x=AV.v[a.l][+a.i];x[a.p]=a.p=='d'?+t.value:t.value;if(a.p=='f'&&x.o!==undefined){x.o=OPS[tp(x.f)][0];x.v=''}})}
else if(t.id=='imp'&&t.files[0])t.files[0].text().then(s=>commit(()=>{db=JSON.parse(s);fix()}))});
document.addEventListener('dblclick',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k,o=db.opts[k][+c.dataset.i],n=(prompt('Rename option:',o)||'').trim();if(n&&n!=o)commit(()=>{db.opts[k][+c.dataset.i]=n;db.cols.forEach(c=>c.rows.forEach(r=>{if(r[k]==o)r[k]=n}))})});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c)DR={k:c.dataset.k,i:+c.dataset.i}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.chip'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('.chip');if(!c||!DR)return;e.preventDefault();const k=DR.k,from=DR.i,to=+c.dataset.i;DR=null;if(c.dataset.k!=k||to==from)return;commit(()=>{const a=db.opts[k];a.splice(to,0,a.splice(from,1)[0])})});
window.onhashchange=()=>{pop=null;TV={};render()};
/* Google Drive (drive.file scope: the app only sees the file it creates) */
const DCID='569011096286-069oa7rksk4v5a22t2gv8vlmstsgg0ca.apps.googleusercontent.com',FN='collection-vault.json',API='https://www.googleapis.com/';
function gConnect(cb){const id=localStorage.cid||DCID;if(!id)return setSt('Add your Client ID first');if(!window.google)return setSt('Google sign-in did not load. Check your connection.');
tc=google.accounts.oauth2.initTokenClient({client_id:id,scope:API+'auth/drive.file',callback:r=>{if(r.access_token){tok=r.access_token;setSt('Connected to Drive');cb&&cb()}else setSt('Google sign-in failed')}});tc.requestAccessToken({prompt:''})}
async function dr(u,o={}){const r=await fetch(u,{...o,headers:{...o.headers,Authorization:'Bearer '+tok}});if(!r.ok)throw new Error(r.status);return r}
async function findF(){return((await(await dr(API+'drive/v3/files?fields=files(id)&q='+encodeURIComponent(`name='${FN}' and trashed=false`))).json()).files[0]||{}).id}
async function backup(){if(!tok)return gConnect(backup);try{const id=await findF(),bd='b'+Date.now();
await dr(API+'upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:`--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(id?{}:{name:FN})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${ser(db)}\r\n--${bd}--`});setSt('Backed up '+new Date().toLocaleTimeString())}catch(e){tok=null;setSt('Backup failed ('+e.message+'). Click Connect again.')}}
async function restore(){if(!tok)return gConnect(restore);try{const id=await findF();if(!id)return setSt('No backup found in Drive');const s=await(await dr(API+'drive/v3/files/'+id+'?alt=media')).text();commit(()=>{db=JSON.parse(s);fix()});setSt('Restored from Drive')}catch(e){tok=null;setSt('Restore failed ('+e.message+')')}}
save();render();
</script></body></html>
